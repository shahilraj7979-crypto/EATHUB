<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EATHUB - Delicious Food Delivered</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- Site Header -->
  <header class="site-header">
    <div class="header-container">
      <a href="#" class="brand">
        <div class="brand-icon">🍽️</div>
        <div class="brand-text">
          <h1>EATHUB</h1>
          <p>Fresh Food &amp; Fast Delivery</p>
        </div>
      </a>
      <div class="cart-indicator">
        <span>Cart</span>
        <span class="cart-badge" id="cartBadge">0</span>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="main-content">
    
    <!-- Hero Banner -->
    <section class="hero-banner">
      <h2>Welcome to EATHUB</h2>
      <p>Discover freshly prepared specialties crafted with quality ingredients. Prepared fresh for every order.</p>
      <div class="hero-tags">
        <span class="hero-tag">✓ 100% Fresh Ingredients</span>
        <span class="hero-tag">✓ Fast Kitchen Prep</span>
        <span class="hero-tag">✓ Authentic Flavors</span>
      </div>
    </section>

    <!-- Category Filters -->
    <nav class="category-filter-nav" aria-label="Food category filters">
      <button class="filter-btn active" data-category="All">All Items</button>
      <button class="filter-btn" data-category="Pizza">Pizza</button>
      <button class="filter-btn" data-category="Burger">Burger</button>
      <button class="filter-btn" data-category="Chinese">Chinese</button>
      <button class="filter-btn" data-category="Indian">Indian</button>
      <button class="filter-btn" data-category="Dessert">Dessert</button>
      <button class="filter-btn" data-category="Drinks">Drinks</button>
    </nav>

    <!-- Food Cards Grid -->
    <section class="food-grid" id="foodGrid" aria-label="Food items list">
      <!-- Cards dynamically generated by js/app.js -->
    </section>

  </main>

  <!-- Toast Notification Feedback -->
  <div class="toast-notice" id="toastNotice" role="status" aria-live="polite">
    <span id="toastMessage">Item added</span>
  </div>

  <!-- Scripts -->
  <script src="js/food-data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
